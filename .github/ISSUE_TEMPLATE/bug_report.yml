name: Bug report
description: Something Broadside does wrong with a PDF or in its API
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security problem (a crash, hang or memory blow-up on a crafted file counts), do not file it here. Use private vulnerability reporting from the Security tab; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What Broadside did, including any exception, diagnostic or wrong output.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: The PDF or a minimal repro
      description: Attach the PDF that triggers the problem (drag it into this field), or paste the smallest code and file that reproduce it. Hand-written minimal files in the style of tests/Corpus are ideal. Do not attach confidential documents.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Broadside version
      description: The package version, or the commit SHA if building from source.
      placeholder: "0.1.0 or a1b2c3d"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, .NET SDK version and, for rendering bugs, the backend.
      placeholder: "macOS 26 arm64, .NET 10.0.100, software rasterizer"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you expected instead, and what other PDF software does with the same file if you know.
    validations:
      required: true
