# The .NET MAUI viewer sample's UI tests on Mac Catalyst and the iOS simulator (#358): weekly, on pull requests that touch the sample
# or the viewer shells it is built from, and on the "Run workflow" button. The app walks every panel through its real controls
# (samples/Broadside.Viewer.Maui.Sample/UiTests.cs) and logs a verdict that uitest.sh waits for. The Android run is in maui-android.yml,
# on the same emulator as the smoke run. See .github/workflows/README.md.
name: MAUI UI tests

on:
  schedule:
    # Mondays 06:17 UTC, after maui-android.yml.
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'samples/Broadside.Viewer.Maui.Sample/**'
      - 'samples/Broadside.Viewer.Blazor.Sample/DocumentCreator.cs'
      - 'src/Broadside.Viewer.Maui/**'
      - 'src/Broadside.Viewer/**'
      - 'src/Broadside.Rendering.Skia/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/maui-ui.yml'

concurrency:
  group: maui-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  apple:
    name: ui (${{ matrix.platform }})
    runs-on: macos-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        platform: [catalyst, ios]
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-maui-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', 'nuget.config') }}
          restore-keys: nuget-maui-${{ runner.os }}-

      # The workload's Apple SDK packs want Xcode 27 (see ci.yml's maui job): an app bundle can only be linked with it. Select the
      # newest Xcode 27 on the image; without one the UI tests cannot run: the job warns, says so in its summary and skips the remaining steps, so a runner image without Xcode 27 does not block every PR.
      - name: Select Xcode 27
        id: xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [[ -z "$xcode" ]]; then
            echo "### The MAUI UI tests did not run: this runner image has no Xcode 27" >> "$GITHUB_STEP_SUMMARY"
            ls -d /Applications/Xcode*.app >> "$GITHUB_STEP_SUMMARY" || true
            echo "::warning title=MAUI UI tests::This runner image has no Xcode 27; the UI tests were skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install the maui workload
        if: steps.xcode.outputs.available == 'true'
        timeout-minutes: 20
        run: dotnet workload install maui

      - name: Build the sample for Mac Catalyst
        if: steps.xcode.outputs.available == 'true' && matrix.platform == 'catalyst'
        run: dotnet build samples/Broadside.Viewer.Maui.Sample -f net10.0-maccatalyst -warnaserror -p:ValidateXcodeVersion=false

      - name: Build the sample for the iOS simulator
        if: steps.xcode.outputs.available == 'true' && matrix.platform == 'ios'
        run: dotnet build samples/Broadside.Viewer.Maui.Sample -f net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64 -warnaserror -p:ValidateXcodeVersion=false

      - name: Find the app
        if: steps.xcode.outputs.available == 'true'
        run: |
          case "${{ matrix.platform }}" in
            catalyst) app=$(find artifacts/bin/Broadside.Viewer.Maui.Sample -path '*maccatalyst*' -name '*.app' -maxdepth 4 | head -n 1) ;;
            ios) app=$(find artifacts/bin/Broadside.Viewer.Maui.Sample -path '*iossimulator*' -name '*.app' -maxdepth 4 | head -n 1) ;;
          esac
          test -n "$app" || { echo "No .app under artifacts/bin/Broadside.Viewer.Maui.Sample"; find artifacts/bin/Broadside.Viewer.Maui.Sample -name '*.app' -maxdepth 4; exit 1; }
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Boot an iPhone simulator
        if: steps.xcode.outputs.available == 'true' && matrix.platform == 'ios'
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,l in sorted(d.items(), reverse=True) if 'iOS' in r for x in l if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b

      - name: Run the UI tests
        if: steps.xcode.outputs.available == 'true'
        run: bash samples/Broadside.Viewer.Maui.Sample/uitest.sh ${{ matrix.platform }} "$APP" 900
