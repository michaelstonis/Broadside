# Continuous integration: every pull request, every push to main, nightly on the integration branch and the "Run workflow" button.
# See .github/workflows/README.md for what each job does, which OS it runs on and what a pull request skips.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly on the integration branch (NIGHTLY_BRANCH), everything including the Category=Exhaustive sweeps (issue #587). GitHub
  # runs schedules from the default branch's copy of this file, so the nightly starts once this file is on main.
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

# One run per PR or branch and event; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  # Verify must never try to launch a diff tool on a build agent (tests/README.md, "Snapshots").
  DiffEngine_Disabled: true
  # The branch the nightly run checks out, and the ref every job checks out (empty: the event's own commit).
  NIGHTLY_BRANCH: spec/33-broadside-v1
  CHECKOUT_REF: ${{ github.event_name == 'schedule' && 'spec/33-broadside-v1' || '' }}
  # dotnet-affected, which the plan job runs on pull requests (issue #587).
  DOTNET_AFFECTED_VERSION: 7.0.1

jobs:
  # Decides whether this run builds and tests everything or only what a pull request affects, and which jobs run (issue #587;
  # .github/scripts/ci-plan.sh, tested by .github/scripts/test-ci-plan.sh). Everything runs on pushes, the nightly, the "Run
  # workflow" button, pull requests into main or from a release/* branch, pull requests that change global.json, a solution or
  # filter, Directory.Solution.props, the CI workflows or scripts, the hand-written corpus or the golden images, and whenever
  # dotnet-affected fails. Otherwise dotnet-affected lists the projects the pull request affects, and the job summary shows the
  # plan. A job that is not needed is skipped, or for the matrix jobs reports success without doing anything.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      full: ${{ steps.plan.outputs.full }}
      linux: ${{ steps.plan.outputs.linux }}
      windows: ${{ steps.plan.outputs.windows }}
      macos: ${{ steps.plan.outputs.macos }}
      format_projects: ${{ steps.plan.outputs.format_projects }}
      aot: ${{ steps.plan.outputs.aot }}
      size_probes: ${{ steps.plan.outputs.size_probes }}
      verapdf: ${{ steps.plan.outputs.verapdf }}
      conformance: ${{ steps.plan.outputs.conformance }}
      format: ${{ steps.plan.outputs.format }}
      fuzz: ${{ steps.plan.outputs.fuzz }}
      bench: ${{ steps.plan.outputs.bench }}
      blazor: ${{ steps.plan.outputs.blazor }}
      uno: ${{ steps.plan.outputs.uno }}
      maui: ${{ steps.plan.outputs.maui }}
      winui: ${{ steps.plan.outputs.winui }}
      avalonia: ${{ steps.plan.outputs.avalonia }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # The merge commit and its first parent, the base branch as merged into.
          fetch-depth: 2
          ref: ${{ env.CHECKOUT_REF }}

      - name: Test the decision
        run: .github/scripts/test-ci-plan.sh

      - name: Set up .NET
        if: github.event_name == 'pull_request'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install dotnet-affected
        if: github.event_name == 'pull_request'
        run: dotnet tool install dotnet-affected --version "${DOTNET_AFFECTED_VERSION}" --tool-path "${RUNNER_TEMP}/dotnet-affected"

      - name: Decide
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          DOTNET_AFFECTED: ${{ runner.temp }}/dotnet-affected/dotnet-affected
        run: .github/scripts/ci-plan.sh

  # Builds and tests in Release on every OS, and (on Linux) packs the core packages. A full run builds all of Broadside.slnx and
  # tests Broadside.Core.slnf on every OS, as below. A narrowed pull request (issue #587) builds on each OS only the affected
  # projects of its set (the plan job's linux, windows and macos outputs, written into artifacts/ci/build.slnf): Linux the core
  # filter and the few projects nothing else builds, and runs their tests except the Category=Exhaustive sweeps, which run as
  # samples; Windows and macOS their platform backends and viewers, the platform tests and the render-hash test. A leg with
  # nothing to build reports success at once. The samples and UI tests of MAUI, Uno, Blazor, Avalonia and WinUI build in their
  # own jobs below. The CoreGraphics and Android backends drop out of the build on Linux and Windows through the
  # BroadsideBuildPlatformBackends gate in their project files; macOS installs the workloads and builds them.
  # Everything is built once in Release so that test and pack can run with --no-build.
  build-test:
    name: build-test (${{ matrix.os }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            leg: linux
          - os: windows-latest
            leg: windows
          - os: macos-latest
            leg: macos
    env:
      # `all` (everything), the projects of a narrowed pull request, or empty (nothing to do).
      PROJECTS: ${{ needs.plan.outputs[matrix.leg] }}
    steps:
      - name: Plan
        shell: bash
        run: |
          case "${PROJECTS}" in
            all) echo "Builds Broadside.slnx and tests everything." ;;
            "") echo "Nothing this leg builds is affected by the pull request; see the plan job's summary." ;;
            *) echo "Narrowed to the affected projects:"; tr ' ' '\n' <<< "${PROJECTS}" ;;
          esac

      - name: Check out
        if: env.PROJECTS != ''
        uses: actions/checkout@v7
        with:
          # MinVer computes the package version from the tag history.
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up .NET
        if: env.PROJECTS != ''
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The NuGet cache (issue #587) is keyed on what decides the package versions, not on every project file, and only this job's
      # full runs on Linux and Windows save it (after restoring the whole solution, so it holds every package the other jobs
      # restore from it); a narrowed or any other job only restores it. A run that restores the exact key saves nothing.
      # Pushes to main and the nightly save into main's scope, which every pull request can read. macOS keeps no NuGet cache:
      # the whole solution's restore there is 3.5 GB of mobile runtime packs, slower to restore than to download, and it pushed
      # the repository past its 10 GB cache limit so that the other entries were evicted between runs.
      - name: Restore the NuGet cache
        id: nuget
        if: env.PROJECTS != '' && runner.os != 'macOS'
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install platform workloads (macOS)
        if: runner.os == 'macOS' && (env.PROJECTS == 'all' || contains(env.PROJECTS, 'CoreGraphics') || contains(env.PROJECTS, 'Android'))
        timeout-minutes: 20
        run: dotnet workload install macos ios maccatalyst android

      - name: Install qpdf and poppler-utils (Linux)
        # Written files are checked with qpdf --check and pdfinfo (issue #44); the tests skip where the tools are missing.
        # The linearized writer follows qpdf 12's object placement and the tests require qpdf 12 or later (Ubuntu's package is 11.9,
        # whose linearization check disagrees with qpdf 12's own output), so qpdf comes from its pinned, checksummed release build.
        if: runner.os == 'Linux' && env.PROJECTS != ''
        env:
          QPDF_VERSION: 12.4.2
          QPDF_SHA256: db367d897829f22c4198ce1094143c9d467bd6ee7dfabc44ba6f02056b24f8b1
        run: |
          # Ubuntu's archive is sometimes unreachable from the runners. Retry, then carry on without poppler-utils: the tests
          # that need pdfinfo skip, and the warning says so on the run's summary.
          installed=false
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=3 poppler-utils; then installed=true; break; fi
            sleep $((attempt * 30))
          done
          if [ "$installed" != true ]; then
            echo "::warning title=poppler-utils::poppler-utils could not be installed; the pdfinfo checks are skipped on this run."
          fi
          curl -fsSL -o "$RUNNER_TEMP/qpdf.zip" "https://github.com/qpdf/qpdf/releases/download/v${QPDF_VERSION}/qpdf-${QPDF_VERSION}-bin-linux-x86_64.zip"
          echo "${QPDF_SHA256}  $RUNNER_TEMP/qpdf.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/qpdf.zip" -d "$RUNNER_TEMP/qpdf"
          QPDF_BIN="$(dirname "$(find "$RUNNER_TEMP/qpdf" -type f -name qpdf -perm -u+x | head -n 1)")"
          echo "$QPDF_BIN" >> "$GITHUB_PATH"
          "$QPDF_BIN/qpdf" --version

      - name: Write the solution filter (narrowed pull request)
        # BUILD is what restore and build take; TESTS says which tests run: everything (all), the affected test projects of the
        # filter without the Category=Exhaustive sweeps (affected), or none.
        if: env.PROJECTS != ''
        shell: bash
        run: |
          if [ "${PROJECTS}" = all ]; then
            { echo "BUILD=Broadside.slnx"; echo "TESTS=all"; } >> "${GITHUB_ENV}"
            exit 0
          fi
          mkdir -p artifacts/ci
          jq -n --arg projects "${PROJECTS}" '{solution: {path: "../../Broadside.slnx", projects: ($projects | split(" "))}}' > artifacts/ci/build.slnf
          cat artifacts/ci/build.slnf
          tests=none
          if [ "${RUNNER_OS}" = Linux ] && tr ' ' '\n' <<< "${PROJECTS}" | grep -q '\.Tests\.csproj$'; then tests=affected; fi
          { echo "BUILD=artifacts/ci/build.slnf"; echo "TESTS=${tests}"; } >> "${GITHUB_ENV}"

      - name: Restore
        # In the configuration the build uses: a macOS app (the CoreGraphics test and benchmark apps) builds for both osx-arm64 and
        # osx-x64 in Release but only for the host in Debug, and the assets file must list every runtime the build compiles for.
        if: env.PROJECTS != ''
        run: dotnet restore ${{ env.BUILD }} -p:Configuration=Release

      - name: Save the NuGet cache
        if: env.PROJECTS == 'all' && runner.os != 'macOS' && steps.nuget.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', 'nuget.config') }}

      - name: Build
        # The macOS workload of the 10.0.4xx workload set (macOS SDK pack 27.0) demands Xcode 27.0 for anything that outputs an app
        # bundle (the CoreGraphics test and benchmark apps), and the macos-26 runner image has Xcode 26.x only. ValidateXcodeVersion=false
        # skips the exact major.minor check, and Registrar=dynamic skips the static registrar, the one build step that needs the macOS
        # 27.0 SDK headers (MT0179). Both only affect Apple app projects; drop them once the image ships Xcode 27.
        if: env.PROJECTS != ''
        run: dotnet build ${{ env.BUILD }} -c Release -warnaserror --no-restore -p:ValidateXcodeVersion=false -p:Registrar=dynamic

      - name: Test
        if: env.TESTS == 'all'
        run: dotnet test Broadside.Core.slnf -c Release --no-build --results-directory artifacts/test-results -- --report-xunit-trx

      - name: Test the affected projects (narrowed pull request, Linux)
        # The Category=Exhaustive sweeps run as deterministic samples here (tests/Broadside.TestSupport/Exhaustive.cs); main, the
        # nightly and pull requests into main run them whole.
        if: env.TESTS == 'affected'
        run: >
          dotnet test artifacts/ci/build.slnf -c Release --no-build --results-directory artifacts/test-results --
          --report-xunit-trx --filter-not-trait "Category=Exhaustive"

      - name: Run the document builder samples (Linux)
        # The builder guide's samples (issue #397) compile with the solution; running them writes each PDF, fails on any diagnostic
        # above information, and qpdf checks every file. Their snapshots and veraPDF checks run in Broadside.Layout.Tests.
        if: runner.os == 'Linux' && (env.PROJECTS == 'all' || contains(env.PROJECTS, 'samples/Broadside.BuilderSamples/'))
        run: |
          dotnet run --project samples/Broadside.BuilderSamples -c Release --no-build -- "$RUNNER_TEMP/builder-samples"
          for file in "$RUNNER_TEMP"/builder-samples/*.pdf; do qpdf --check "$file" > /dev/null; done

      - name: Test the SIMD kernels without hardware intrinsics (Linux)
        # The SimdKernel category again with Vector128.IsHardwareAccelerated false (issue #470): each kernel's dispatcher takes its
        # scalar path and the vector method runs on the software fallback. Seconds: the build above is reused. A test project with
        # no kernel tests exits 8 (zero tests ran), which is ignored. Narrowed, the affected projects without the exhaustive sweeps.
        if: runner.os == 'Linux' && (env.TESTS == 'all' || env.TESTS == 'affected')
        shell: bash
        env:
          DOTNET_EnableHWIntrinsic: '0'
        run: |
          if [ "${TESTS}" = all ]; then
            dotnet test Broadside.Core.slnf -c Release --no-build -- --filter-trait "Category=SimdKernel" --ignore-exit-code 8
          else
            dotnet test artifacts/ci/build.slnf -c Release --no-build -- --filter-trait "Category=SimdKernel" \
              --filter-not-trait "Category=Exhaustive" --ignore-exit-code 8
          fi

      - name: Test the CoreGraphics backend (macOS)
        # The backend's render tests run on macOS only; the build above already compiled it for macOS, iOS and Mac Catalyst (issue #125).
        if: runner.os == 'macOS' && (env.PROJECTS == 'all' || contains(env.PROJECTS, 'tests/Broadside.Rendering.CoreGraphics.Tests/'))
        run: dotnet test tests/Broadside.Rendering.CoreGraphics.Tests -c Release --no-build --results-directory artifacts/test-results -- --report-xunit-trx

      - name: Test the Direct2D backend (Windows)
        # Draws through Direct2D on a WARP device and compares with the golden images (issue #129); outside Broadside.Core.slnf
        # because it needs Windows. Built above with the rest of the solution.
        if: runner.os == 'Windows' && (env.PROJECTS == 'all' || contains(env.PROJECTS, 'tests/Broadside.Rendering.Direct2D.Tests/'))
        run: dotnet test --project tests/Broadside.Rendering.Direct2D.Tests -c Release --no-build --minimum-expected-tests 1 --results-directory artifacts/test-results -- --report-xunit-trx

      - name: Test the WPF viewer (Windows)
        # The WPF shell (issue #222): the controller, the control and its UI Automation peers, then the UI Automation test that starts
        # the sample app (built above with the solution) and opens, reads, zooms, scrolls, selects and searches the pinned subset
        # through it. Needs the Windows Desktop runtime and the runner's interactive desktop; outside Broadside.Core.slnf.
        if: runner.os == 'Windows' && (env.PROJECTS == 'all' || contains(env.PROJECTS, 'tests/Broadside.Viewer.Wpf.Tests/'))
        run: dotnet test --project tests/Broadside.Viewer.Wpf.Tests -c Release --no-build --minimum-expected-tests 1 --results-directory artifacts/test-results -- --report-xunit-trx

      - name: Test that every corpus page renders to the same bytes twice (narrowed pull request, Windows and macOS)
        # The cross-platform render-hash test (RenderHashTests, issue #233), the one core test a narrowed pull request runs on these
        # two OSes; render-determinism.yml compares the hashes across them.
        if: runner.os != 'Linux' && env.PROJECTS != 'all' && contains(env.PROJECTS, 'tests/Broadside.Rendering.Tests/')
        run: >
          dotnet test --project tests/Broadside.Rendering.Tests -c Release --no-build --minimum-expected-tests 1
          --results-directory artifacts/test-results -- --report-xunit-trx --filter-trait "Category=RenderHash"

      - name: Dry run the Direct2D benchmarks (Windows)
        # bench-dry runs bench/Broadside.Benchmarks on Linux; the Direct2D backend's benchmarks need Windows.
        if: runner.os == 'Windows' && (env.PROJECTS == 'all' || contains(env.PROJECTS, 'bench/Broadside.Rendering.Direct2D.Benchmarks/'))
        run: dotnet run -c Release --project bench/Broadside.Rendering.Direct2D.Benchmarks --no-build -- --filter '*' --job dry

      - name: Upload test results
        if: always() && env.PROJECTS != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          # The .md files are measurement tables some tests write beside their results (the WIC JPEG measurement, issue #377).
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test-results/**/*.md
          if-no-files-found: warn

      - name: Upload golden-image differences
        # A failing golden-image comparison leaves the render and a diff image beside the golden image (issue #120).
        if: failure() && env.PROJECTS != ''
        uses: actions/upload-artifact@v7
        with:
          name: golden-images-${{ matrix.os }}
          path: |
            tests/Golden/*.received.png
            tests/Golden/*.diff.png
          if-no-files-found: ignore

      - name: Pack (Linux)
        # Full runs only: a narrowed run does not build every package.
        if: runner.os == 'Linux' && env.PROJECTS == 'all'
        run: dotnet pack Broadside.Core.slnf -c Release --no-build

      - name: Upload packages (Linux)
        if: runner.os == 'Linux' && env.PROJECTS == 'all'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            artifacts/package/release/*.nupkg
            artifacts/package/release/*.snupkg
          if-no-files-found: error

  # Publishes the software rasterizer's smoke host with Native AOT (trimmed, no JIT) and runs it: it renders the rendering corpus
  # files, compares them with the reviewed snapshots and round-trips the PNG output (issue #95). Proves rendering needs no native
  # dependency beyond the runtime and no reflection the trimmer cannot see. Native AOT needs the platform linker: clang on Linux
  # (preinstalled with zlib on the hosted image), Xcode on macOS, the MSVC tools on Windows.
  aot-smoke:
    name: aot-smoke (${{ matrix.os }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      RUN: ${{ needs.plan.outputs.aot }}
    steps:
      - name: Plan
        if: env.RUN != 'true'
        run: echo "The pull request does not affect tests/Broadside.Rendering.AotSmoke; see the plan job's summary."

      - name: Check out
        if: env.RUN == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up .NET
        if: env.RUN == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore the NuGet cache
        if: env.RUN == 'true' && runner.os != 'macOS'
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish the AOT smoke host
        if: env.RUN == 'true'
        run: dotnet publish tests/Broadside.Rendering.AotSmoke -c Release --use-current-runtime -o artifacts/aot-smoke

      - name: Run it natively compiled
        if: env.RUN == 'true'
        shell: bash
        run: artifacts/aot-smoke/Broadside.Rendering.AotSmoke --require-aot

  # Publishes the Native AOT size probes (bench/SizeProbes, issue #361), one tiny app per scenario, runs each, and fails when one
  # grows past the tolerance of bench/baselines/gate/sizes.json, or is new or missing there (bench/baselines/gate/README.md, "Size
  # probes"). The baseline is recorded for osx-arm64, so this runs on the macOS runner. The job summary has the table; the measured
  # sizes are an artifact, ready to record.
  size-probes:
    name: size-probes
    needs: plan
    if: needs.plan.outputs.size_probes == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish and run the probes
        run: bench/size-probes.sh --out artifacts/size-probes/sizes.json

      - name: Compare with the baseline
        run: >
          dotnet run --project tools/BenchGate -c Release --
          sizes --baseline bench/baselines/gate/sizes.json --results artifacts/size-probes/sizes.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the measured sizes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: size-probes
          path: artifacts/size-probes/sizes.json
          if-no-files-found: ignore

  # Validates the files Broadside writes in a PDF/A mode with veraPDF, the PDF Association's reference validator (issue #201; spec
  # story 42; PDF/A-4 and 4f, #203): every test in the VeraPdf trait saves a document as PDF/A and asserts that veraPDF reports no failed rule. veraPDF is a
  # Java tool used here only, never by the library (ADR 0001); its release is pinned and checksummed like qpdf above, and
  # BROADSIDE_REQUIRE_VERAPDF makes a test fail rather than skip if the tool cannot be found, so the check never silently stops.
  verapdf:
    name: verapdf
    needs: plan
    if: needs.plan.outputs.verapdf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore the NuGet cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install veraPDF
        # The greenfield (PDF/A and PDF/UA) command-line validator, installed headless by its IzPack installer from the pinned,
        # checksummed release archive.
        env:
          VERAPDF_VERSION: 1.28.2
          VERAPDF_SHA256: d1693a5f0bf0997180f6d97e8a5568b0cf39e27eee338d439c8adb58435c1e89
        run: |
          curl -fsSL -o "$RUNNER_TEMP/verapdf.zip" "https://software.verapdf.org/rel/${VERAPDF_VERSION%.*}/verapdf-greenfield-${VERAPDF_VERSION}-installer.zip"
          echo "${VERAPDF_SHA256}  $RUNNER_TEMP/verapdf.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/verapdf.zip" -d "$RUNNER_TEMP/verapdf-installer"
          cat > "$RUNNER_TEMP/auto-install.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir"><installpath>$RUNNER_TEMP/verapdf</installpath></com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="true"/>
              <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
              <pack index="2" name="veraPDF Validation model" selected="false"/>
              <pack index="3" name="veraPDF Documentation" selected="false"/>
              <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          EOF
          java -jar "$RUNNER_TEMP/verapdf-installer/verapdf-greenfield-${VERAPDF_VERSION}/verapdf-izpack-installer-${VERAPDF_VERSION}.jar" "$RUNNER_TEMP/auto-install.xml"
          echo "$RUNNER_TEMP/verapdf" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/verapdf/verapdf" --version

      - name: Build the tests
        run: |
          dotnet build tests/Broadside.Tests -c Release -warnaserror
          dotnet build tests/Broadside.Fonts.Standard14.Tests -c Release -warnaserror
          dotnet build tests/Broadside.Layout.Tests -c Release -warnaserror

      # The PDF/A conversion of real-world files (#229) converts every file of these two corpora and checks each it says conforms.
      - name: Fetch the pdfbox and pdf20examples corpora
        run: dotnet run -c Release --project tools/CorpusFetcher -- --only pdfbox,pdf20examples

      - name: Validate PDF/A output with veraPDF
        env:
          BROADSIDE_REQUIRE_VERAPDF: '1'
          BROADSIDE_CORPUS_DIR: ${{ github.workspace }}/corpus
        run: |
          dotnet test --project tests/Broadside.Tests -c Release --no-build -- --filter-trait "Category=VeraPdf"
          dotnet test --project tests/Broadside.Fonts.Standard14.Tests -c Release --no-build -- --filter-trait "Category=VeraPdf"

      # PDF/UA-1 output from flow layout (#204, and the tagging by construction it builds on, #179) against veraPDF's PDF/UA-1
      # profile (plus PDF/A-2u for a combined save, and PDF/A-4 for a PDF/A-4 save asking for UA-1, #203); PDF/UA-2 and Well-Tagged
      # PDF output (#205) against the ua2 (PDF/UA-2 + ISO/TS 32005), wt1r and wt1a (WTPDF 1.0) profiles, alone and with PDF/A-4.
      - name: Validate PDF/UA-1, PDF/UA-2 and WTPDF output with veraPDF
        env:
          BROADSIDE_REQUIRE_VERAPDF: '1'
        run: dotnet test --project tests/Broadside.Layout.Tests -c Release --no-build -- --filter-trait "Category=VeraPdf"

  # Shows the public API diff of the PR in the job summary for human review. It never fails: the
  # PublicApiAnalyzers (RS0016/RS0017) already fail the build when the API files and the code disagree.
  api-surface:
    name: api-surface
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Public API diff against the base branch
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="origin/${BASE_REF}"
          diff=$(git diff "${base}..." -- 'src/**/PublicAPI.*.txt' || true)
          {
            echo "## Public API surface"
            echo
            echo "Diff of \`src/**/PublicAPI.Shipped.txt\` and \`PublicAPI.Unshipped.txt\` against the merge base with \`${base}\`."
            echo
            if [ -z "${diff}" ]; then
              echo "_No public API changes._"
            else
              echo '```diff'
              echo "${diff}"
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  # Checks docs/conformance/ with tools/ConformanceCheck (issue #7) and, with --citations, the clause citations in the XML
  # documentation of the packages docs/conformance/citation-policy.json checks (issue #240), so those are built first, and the
  # per-specification counts generated into site/articles/conformance.md (issue #241).
  conformance-map:
    name: conformance-map
    needs: plan
    if: needs.plan.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore the NuGet cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build the packages whose citations are checked
        shell: bash
        run: |
          for package in Broadside Broadside.Fonts.Cmaps Broadside.Fonts.Standard14 Broadside.Layout Broadside.Rendering; do
            dotnet build "src/${package}/${package}.csproj" -warnaserror
          done

      - name: Check the conformance map and clause citations
        shell: bash
        run: dotnet run --project tools/ConformanceCheck -- --root . --summary --citations --site-page site/articles/conformance.md >> "${GITHUB_STEP_SUMMARY}"

  # Checks the formatting of everything dotnet format can see: the core solution filter, and the fuzz, benchmark and Windows-only
  # Direct2D and WPF test, benchmark and sample projects, which are outside it. A narrowed pull request checks the affected ones.
  format:
    name: format
    needs: plan
    if: needs.plan.outputs.format == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore the NuGet cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Check the formatting of the affected projects (narrowed pull request)
        if: needs.plan.outputs.format_projects != 'all'
        shell: bash
        env:
          PROJECTS: ${{ needs.plan.outputs.format_projects }}
        run: |
          mkdir -p artifacts/ci
          jq -n --arg projects "${PROJECTS}" '{solution: {path: "../../Broadside.slnx", projects: ($projects | split(" "))}}' > artifacts/ci/format.slnf
          tr ' ' '\n' <<< "${PROJECTS}"
          dotnet format artifacts/ci/format.slnf --verify-no-changes

      - name: Check formatting
        if: needs.plan.outputs.format_projects == 'all'
        run: |
          dotnet format Broadside.Core.slnf --verify-no-changes
          dotnet format tests/Broadside.Fuzz/Broadside.Fuzz.csproj --verify-no-changes
          dotnet format bench/Broadside.Benchmarks/Broadside.Benchmarks.csproj --verify-no-changes
          dotnet format tests/Broadside.Rendering.Direct2D.Tests/Broadside.Rendering.Direct2D.Tests.csproj --verify-no-changes
          dotnet format bench/Broadside.Rendering.Direct2D.Benchmarks/Broadside.Rendering.Direct2D.Benchmarks.csproj --verify-no-changes
          dotnet format tests/Broadside.Viewer.Wpf.Tests/Broadside.Viewer.Wpf.Tests.csproj --verify-no-changes
          dotnet format samples/Broadside.Viewer.Wpf.Sample/Broadside.Viewer.Wpf.Sample.csproj --verify-no-changes
          dotnet format samples/Broadside.BuilderSamples/Broadside.BuilderSamples.csproj --verify-no-changes
          dotnet format tests/Broadside.Viewer.WinUI.UITests/Broadside.Viewer.WinUI.UITests.csproj --verify-no-changes

  # Builds the fuzz harness once for the fuzz-smoke shards and decides each target's time (issue #587): 60 s on full runs; on a
  # narrowed pull request 60 s for the targets whose code changed (tests/Broadside.Fuzz/smoke-areas.txt; any change to the
  # harness counts for all) and 15 s for the rest. Uploads the build and the plan as fuzz-harness.
  fuzz-build:
    name: fuzz-build
    needs: plan
    if: needs.plan.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # The merge commit and its first parent, for the changed paths.
          fetch-depth: 2
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore the NuGet cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build the fuzz harness
        run: dotnet build tests/Broadside.Fuzz -c Release -warnaserror

      - name: Decide each target's time
        shell: bash
        env:
          FULL: ${{ needs.plan.outputs.full }}
        run: |
          mapfile -t targets < <(dotnet artifacts/bin/Broadside.Fuzz/release/Broadside.Fuzz.dll --list)
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::--list returned no fuzz targets"
            exit 1
          fi
          changed=""
          if [ "${FULL}" != true ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
          fi
          harness=$(grep -E '^tests/Broadside\.Fuzz/' <<< "${changed}" || true)
          : > artifacts/fuzz-plan.txt
          full_targets=()
          for target in "${targets[@]}"; do
            seconds=15
            if [ "${FULL}" = true ] || [ -n "${harness}" ]; then
              seconds=60
            else
              while read -r pattern expression; do
                case "${pattern}" in ''|'#'*) continue ;; esac
                # shellcheck disable=SC2053 # the pattern may be a shell glob such as filter-*
                if [[ "${target}" == ${pattern} ]] && grep -qE "${expression}" <<< "${changed}"; then
                  seconds=60
                  break
                fi
              done < tests/Broadside.Fuzz/smoke-areas.txt
            fi
            [ "${seconds}" -eq 60 ] && full_targets+=("${target}")
            echo "${target} ${seconds}" >> artifacts/fuzz-plan.txt
          done
          {
            echo "## Fuzz smoke"
            echo
            echo "${#targets[@]} targets; ${#full_targets[@]} for 60 s, the rest for 15 s."
            if [ "${FULL}" != true ] && [ -z "${harness}" ] && [ "${#full_targets[@]}" -gt 0 ]; then
              echo
              echo "60 s (their code changed): ${full_targets[*]}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the harness
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-harness
          path: |
            artifacts/bin/Broadside.Fuzz/release/
            artifacts/fuzz-plan.txt
          if-no-files-found: error
          retention-days: 1

  # Runs every fuzz target in smoke mode (tests/Broadside.Fuzz/README.md) for the time fuzz-build gave it, the targets of the plan
  # split over parallel shards (target i runs in shard i mod the shard count) so the run stays far below its timeout as targets
  # are added. Each shard runs the harness fuzz-build uploaded on a checkout (for tests/Corpus/ and the regression seeds). A
  # shard reports success without doing anything when the pull request does not affect the harness.
  fuzz-smoke:
    name: fuzz-smoke (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [plan, fuzz-build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      RUN: ${{ needs.plan.outputs.fuzz == 'true' && needs.fuzz-build.result == 'success' }}
    steps:
      - name: Plan
        if: env.RUN != 'true'
        run: echo "The pull request does not affect the fuzz harness, or fuzz-build failed; see the plan and fuzz-build jobs."

      - name: Check out
        if: env.RUN == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up .NET
        if: env.RUN == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download the harness
        if: env.RUN == 'true'
        uses: actions/download-artifact@v7
        with:
          name: fuzz-harness
          path: artifacts

      - name: Smoke this shard's targets
        if: env.RUN == 'true'
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          mapfile -t plan < artifacts/fuzz-plan.txt
          status=0
          for index in "${!plan[@]}"; do
            if [ $((index % SHARDS)) -ne "${SHARD}" ]; then
              continue
            fi
            read -r target seconds <<< "${plan[${index}]}"
            echo "::group::${target} (${seconds} s)"
            if ! dotnet artifacts/bin/Broadside.Fuzz/release/Broadside.Fuzz.dll --smoke "${target}" "${seconds}"; then
              echo "::error::fuzz target ${target} reported a finding"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "${status}"

      - name: Upload findings
        if: failure() && env.RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings-${{ matrix.shard }}
          path: artifacts/fuzz/**
          if-no-files-found: ignore

  # Runs every benchmark once in BenchmarkDotNet's dry job so the harness cannot rot (tests/README.md, "Benchmarks").
  bench-dry:
    name: bench-dry
    needs: plan
    if: needs.plan.outputs.bench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore the NuGet cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build the benchmarks
        run: dotnet build bench/Broadside.Benchmarks -c Release -warnaserror

      - name: Dry run every benchmark
        run: dotnet run -c Release --project bench/Broadside.Benchmarks --no-build -- --filter '*' --job dry

      # The realistic tier (#363): the sample documents, not gated, dry-run so it keeps working.
      - name: Dry run the realistic tier
        run: dotnet run -c Release --project bench/Broadside.Benchmarks.Realistic -- --filter '*' --job dry

  # The Blazor WebAssembly viewer sample published as a static site and driven in headless browsers (issues #221, #338); the job is in
  # blazor-wasm.yml. Pull requests into the integration branch run the image's Chrome and Playwright's Firefox; pull requests into
  # main and pushes to main add WebKit, whose system packages are too slow and flaky to install on every pull request (#389).
  # blazor-wasm.yml also runs all three nightly on the integration branch.
  blazor-wasm:
    name: blazor-wasm
    needs: plan
    # blazor-wasm.yml runs nightly on its own, with every browser.
    if: needs.plan.outputs.blazor == 'true' && github.event_name != 'schedule'
    uses: ./.github/workflows/blazor-wasm.yml
    with:
      browsers: ${{ (github.event_name == 'push' || github.base_ref == 'main') && 'firefox webkit' || 'firefox' }}

  # The Uno Platform viewer sample (#225) on its WebAssembly head (Playwright: Chrome and WebKit) and its desktop head (Linux under
  # Xvfb, macOS, Windows), driven by tests/Broadside.Viewer.Uno.UITests; the job is in uno.yml. The shell library and its controller
  # tests build and run in build-test (Broadside.Core.slnf).
  uno:
    name: uno
    needs: plan
    if: needs.plan.outputs.uno == 'true'
    uses: ./.github/workflows/uno.yml

  # The .NET MAUI viewer sample (#226) for Mac Catalyst, the iOS simulator and Android. It needs the maui workload, so it is not in
  # Broadside.slnx; the shell library's platform targets also build in build-test (macOS) and its tests run in Broadside.Core.slnf.
  maui:
    name: maui
    needs: plan
    if: needs.plan.outputs.maui == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-maui-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', 'nuget.config') }}
          restore-keys: nuget-maui-${{ runner.os }}-

      - name: Install the maui workload
        timeout-minutes: 20
        run: dotnet workload install maui

      - name: Install the Android SDK packages the workload needs
        run: >
          dotnet build samples/Broadside.Viewer.Maui.Sample -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true

      # The workload's Apple SDK packs want Xcode 27 and the runner image has Xcode 26 (see build-test's Build step): linking an app
      # bundle fails there (MT0180 in ILLink), so the Apple heads are compiled (C#, analyzers, XAML-free) but not bundled. Build the
      # whole app (-t:Build) once the image ships Xcode 27; locally, with Xcode 27, the Catalyst and simulator apps build and run.
      - name: Compile the sample for Mac Catalyst
        run: >
          dotnet build samples/Broadside.Viewer.Maui.Sample -f net10.0-maccatalyst -t:Compile -warnaserror
          -p:ValidateXcodeVersion=false -p:Registrar=dynamic

      - name: Compile the sample for the iOS simulator
        run: >
          dotnet build samples/Broadside.Viewer.Maui.Sample -f net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64 -t:Compile
          -warnaserror -p:ValidateXcodeVersion=false -p:Registrar=dynamic

      - name: Build the sample for Android
        run: dotnet build samples/Broadside.Viewer.Maui.Sample -f net10.0-android -warnaserror -p:AndroidSdkDirectory="$ANDROID_HOME"

      # Release turns on ILLink and AOT, which Debug does not. #366 shipped because only Debug was built: the APK packaged
      # assemblies its AOT images were not compiled from, and the app aborted at startup. Build every default ABI, then check that
      # each libaot-*.so in the APK holds the MVIDs of the assemblies the APK ships. The emulator run is in maui-android.yml.
      - name: Build the sample for Android in Release (AOT)
        run: >
          dotnet build samples/Broadside.Viewer.Maui.Sample -f net10.0-android -c Release -warnaserror
          -p:AndroidSdkDirectory="$ANDROID_HOME"

      - name: Check the APK's AOT images against its assemblies
        run: >
          dotnet run --project tools/ApkAotCheck --
          artifacts/bin/Broadside.Viewer.Maui.Sample/release_net10.0-android/dev.broadside.viewer.sample-Signed.apk

  # The WinUI 3 viewer (#223) on the Windows runner: the control library, its sample app (unpackaged, Windows App SDK self-contained)
  # and the UI Automation tests that launch the sample and drive it (open, scroll, zoom, select and search the pinned subset; the
  # automation peers' page text in reading order). The library and the controller tests also build and run in build-test on every OS;
  # the sample needs Windows (MakePri, mt.exe), so it is not in Broadside.slnx.
  winui:
    name: winui
    needs: plan
    if: needs.plan.outputs.winui == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-winui-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', 'nuget.config') }}
          restore-keys: nuget-winui-${{ runner.os }}-

      - name: Build the control
        run: dotnet build src/Broadside.Viewer.WinUI -c Release -warnaserror

      - name: Build the sample app
        run: dotnet build samples/Broadside.Viewer.WinUI.Sample -c Release -warnaserror -r win-x64

      - name: Build the UI tests
        run: dotnet build tests/Broadside.Viewer.WinUI.UITests -c Release -warnaserror

      - name: Run the UI Automation tests against the sample
        shell: pwsh
        run: |
          $env:BROADSIDE_WINUI_SAMPLE = (Resolve-Path "artifacts/bin/Broadside.Viewer.WinUI.Sample/release_win-x64/Broadside.Viewer.WinUI.Sample.exe").Path
          dotnet test --project tests/Broadside.Viewer.WinUI.UITests -c Release --no-build --minimum-expected-tests 1 --results-directory artifacts/test-results -- --report-xunit-trx

      # When the sample fails, keep what explains it: the output folder's listing (is the runtime, the resource index, the manifest
      # there?), the manifest the build embedded, the sample's startup log and the Application event log's crash entries.
      - name: Collect the sample's diagnostics
        if: failure()
        shell: pwsh
        run: |
          $out = "artifacts/bin/Broadside.Viewer.WinUI.Sample/release_win-x64"
          $diag = New-Item -ItemType Directory -Force artifacts/winui-diagnostics
          if (Test-Path $out) {
            Get-ChildItem -Recurse -File $out | Select-Object @{n='Path';e={$_.FullName.Substring((Resolve-Path $out).Path.Length + 1)}}, Length, LastWriteTime |
              Format-Table -AutoSize | Out-String -Width 400 | Set-Content "$diag/sample-output-files.txt"
            Get-Content "$diag/sample-output-files.txt"
            if (Test-Path "$out/Broadside.Viewer.WinUI.Sample.log") {
              Copy-Item "$out/Broadside.Viewer.WinUI.Sample.log" $diag
              Write-Host "--- sample log"; Get-Content "$out/Broadside.Viewer.WinUI.Sample.log"
            }
          } else {
            Write-Host "No sample output folder at $out"
          }
          Get-ChildItem -Recurse -File artifacts/obj/Broadside.Viewer.WinUI.Sample -Filter *.manifest -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $diag ($_.Directory.Name + "-" + $_.Name))
          }
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddHours(-1)} -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in '.NET Runtime','Application Error','Windows Error Reporting','Application Hang','SideBySide' } |
            Format-List TimeCreated, ProviderName, Id, LevelDisplayName, Message | Out-String -Width 400 | Set-Content "$diag/application-events.txt"
          Write-Host "--- Application event log (crash entries, last hour)"; Get-Content "$diag/application-events.txt"

      - name: Upload the sample's diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: winui-sample-diagnostics
          path: artifacts/winui-diagnostics/
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-winui
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn

  # The Avalonia viewer (#224): its UI tests run headless on Linux (Avalonia.Headless with Skia drawing and no display server) through
  # real input events: open, scroll, zoom, select and search over the rendering gate's pinned real-world pages (fetched and cached
  # here; BROADSIDE_PINNED_REQUIRED makes a missing one fail), touch gestures, keys, links, form fields, dark mode, worker-thread
  # tiles and the automation peers' reading order. Then the desktop sample builds. The shell library, the tests and the sample also
  # build in build-test on every OS; the tests are not in Broadside.Core.slnf.
  avalonia:
    name: avalonia
    needs: plan
    if: needs.plan.outputs.avalonia == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BROADSIDE_CORPUS_DIR: ${{ github.workspace }}/corpus
      BROADSIDE_PINNED_REQUIRED: 'true'
      # Avalonia's build tasks report build telemetry unless told not to.
      AVALONIA_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-avalonia-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', 'nuget.config') }}
          restore-keys: nuget-avalonia-${{ runner.os }}-

      - name: Cache the pinned pages' corpora
        uses: actions/cache@v6
        with:
          path: corpus
          key: avalonia-pinned-corpora-${{ hashFiles('tools/CorpusFetcher/corpora.json', 'tests/Broadside.Rendering.Tests/CorpusGate/pinned-pages.txt') }}

      - name: Fetch the pinned pages' corpora
        run: dotnet run -c Release --project tools/CorpusFetcher -- --only pdfjs,pdf20examples,gwg-output-suite

      - name: Build the UI tests
        run: dotnet build tests/Broadside.Viewer.Avalonia.Tests -c Release -warnaserror

      - name: Test the viewer headless
        run: >
          dotnet test --project tests/Broadside.Viewer.Avalonia.Tests -c Release --no-build --minimum-expected-tests 30
          --results-directory artifacts/test-results -- --report-xunit-trx

      - name: Build the sample
        run: dotnet build samples/Broadside.Viewer.Avalonia.Sample -c Release -warnaserror

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-avalonia
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn

  # One check for the whole run (issue #587): fails if any job failed or was cancelled, and passes when every job passed or was
  # skipped because the pull request does not affect it. A single required check for branch protection, whatever the plan skips.
  ci:
    name: ci
    needs: [plan, build-test, aot-smoke, size-probes, verapdf, api-surface, conformance-map, format, fuzz-build, fuzz-smoke, bench-dry, blazor-wasm, uno, maui, winui, avalonia]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job's result
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "${NEEDS}"
          failed=$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")' <<< "${NEEDS}")
          if [ -n "${failed}" ]; then
            echo "::error::failed or cancelled: ${failed}"
            exit 1
          fi
