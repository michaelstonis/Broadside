# Blazor WebAssembly demo (samples/Broadside.Viewer.Blazor.Sample, #338) as a static site for GitHub Pages.
#
# Manual only (Actions > Demo site > Run workflow); nothing runs on push or pull request. The build always uploads the site as a
# workflow artifact (blazor-demo-site) to download and host anywhere. Deploying to Pages is a separate, opt-in input: this
# repository's Pages site is the documentation (docs.yml deploys it on every push to main), and a repository has one Pages site, so a
# deploy from here REPLACES the documentation until docs.yml runs again. To host both, publish the demo under a sub-folder of the
# documentation site instead (the demo works from any sub-path). Pages must be enabled with "GitHub Actions" as the source.
name: Demo site

on:
  workflow_dispatch:
    inputs:
      aot:
        description: Compile ahead of time (faster pages; the runtime module is ~25 MB). Off = interpreter, no file over ~4.5 MB.
        type: boolean
        default: true
      runtime-folder:
        description: Folder for the runtime instead of _framework (leave empty for _framework; Pages serves both).
        type: string
        default: ''
      deploy:
        description: Deploy to GitHub Pages (replaces the documentation site, see the comment at the top of this file).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: demo-pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install the wasm-tools workload
        timeout-minutes: 15
        run: dotnet workload install wasm-tools

      - name: Publish the demo
        env:
          AOT: ${{ inputs.aot }}
          RUNTIME_FOLDER: ${{ inputs.runtime-folder }}
        run: |
          args=()
          [ "$AOT" = true ] || args+=(--no-aot)
          [ -z "$RUNTIME_FOLDER" ] || args+=(--runtime-folder "$RUNTIME_FOLDER")
          samples/Broadside.Viewer.Blazor.Sample/publish-static.sh "${args[@]}" site
          # Pages runs Jekyll unless told not to, and Jekyll drops folders starting with "_" (_framework, _content).
          touch site/.nojekyll

      - name: Upload the site
        uses: actions/upload-artifact@v7
        with:
          name: blazor-demo-site
          path: site
          include-hidden-files: true

      - name: Upload the Pages artifact
        if: inputs.deploy
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    if: inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
