# Adding the `perf` label to a pull request re-runs its benchmark gate (bench-gate.yml) so that it compares times too (issue #389):
# the gate's `plan` job reads the labels the pull request has when it runs. The gate itself does not trigger on labels, so that
# labelling a pull request for any other reason never starts, cancels or hides a gate run.
#
# Security: this runs on `pull_request_target` because a `pull_request` run from a fork gets a read-only token, which cannot cancel
# or re-run the gate. `pull_request_target` runs this file as it is on the base branch, with a token that can write, for any
# pull request, including a fork's. That is safe here only because the job is metadata-only, and must stay so:
# - it never checks out, builds, runs or reads anything from the pull request (no actions/checkout, no scripts from the repo);
# - the only values it takes from the event are the label name (compared in `if:`) and the head commit's SHA (passed through an
#   environment variable, never interpolated into the script); the re-run then runs the gate with its normal `pull_request`
#   permissions, read-only for a fork;
# - its token can only manage workflow runs and read pull requests (`permissions:` below), nothing else.
# Only people with triage or write access can add a label, so outsiders cannot trigger it.
name: Benchmark gate (perf label)

on:
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  rerun:
    name: rerun the benchmark gate with times
    if: github.event.label.name == 'perf'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Re-run the gate of the pull request's head commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          latest() {
            gh run list --repo "${GITHUB_REPOSITORY}" --workflow bench-gate.yml --event pull_request --commit "${HEAD_SHA}" --limit 1 \
              --json databaseId,status --jq ".[0].${1} // empty"
          }
          id=$(latest databaseId)
          if [ -z "${id}" ]; then
            echo "::notice title=Benchmark gate::This pull request's head commit has no benchmark gate run: it changes nothing the gate watches. Use the Run workflow button of bench-gate.yml to compare times anyway."
            exit 0
          fi
          # A run in progress planned without the label: cancel it, wait for it to stop, then run it again.
          if [ "$(latest status)" != completed ]; then
            gh run cancel "${id}" --repo "${GITHUB_REPOSITORY}" || true
            for _ in $(seq 1 60); do
              if [ "$(latest status)" = completed ]; then
                break
              fi
              sleep 10
            done
          fi
          gh run rerun "${id}" --repo "${GITHUB_REPOSITORY}"
          echo "Re-ran ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${id} with times."
