# Documentation site: builds the Lunet site (site/) with ./check-docs.sh on every pull request that touches it
# or its inputs (including every README, top-level Markdown file and GitHub template, which ./check-adr-refs.sh scans), and deploys it to GitHub Pages on every push to main.
# See .github/workflows/README.md and docs/research/doc-site-tooling.md.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'docs/**'
      - '.config/**'
      - 'check-docs.sh'
      - 'check-adr-refs.sh'
      - '*.md'
      - '**/README*'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'src/**'
      - 'docs/**'
      - '.config/**'
      - 'check-docs.sh'
      - 'check-adr-refs.sh'
      - '*.md'
      - '**/README*'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# A newer push to the same PR cancels the older run; runs on main queue so a deployment is never cut short.
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false

jobs:
  # Builds the site (Lunet builds the src/ projects for the API reference) and checks routes, API coverage and links.
  # Outside pull requests it also uploads the output as the Pages artifact.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The API reference builds Broadside.Rendering.Android for net10.0-android (site/config.scriban). The Apple
      # workloads do not install on Linux, so Broadside.Rendering.CoreGraphics is documented in
      # site/articles/api-coverage.md instead; that page says which target framework each package is built from.
      - name: Install the android workload
        timeout-minutes: 15
        run: dotnet workload install android

      - name: Install the Android SDK packages the workload needs
        run: >
          dotnet build src/Broadside.Rendering.Android -t:InstallAndroidDependencies -f net10.0-android
          -p:BroadsideBuildPlatformBackends=true -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true

      - name: Build and check the site
        # MSBuild reads the environment, so the Android build inside Lunet finds the runner's SDK.
        run: AndroidSdkDirectory="$ANDROID_HOME" ./check-docs.sh

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/.lunet/build/www

  # Publishes the artifact to https://michaelstonis.github.io/Broadside/. Only from main.
  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
